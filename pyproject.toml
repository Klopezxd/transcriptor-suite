[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriptor-suite"
version = "2.4.5"
description = "Transcriptor Suite — Pipeline modular de transcripción, alineación fonética y diarización de audio."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Klever López", email = "lkleverjosue@gmail.com" }
]
license = { text = "MIT" }
keywords = ["whisper", "whisperx", "transcription", "diarization", "speech-to-text", "pytorch", "cuda"]
dependencies = [
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    "whisperx",
    "gradio>=6.0.0,<7.0.0",
    "pyannote.audio>=4.0.0,<5.0.0",
    "requests>=2.31.0,<3.0.0",
]

[project.optional-dependencies]
hf = ["spaces>=0.28.0"]
dev = ["ruff>=0.11.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PIE"]
ignore = ["E501", "B008", "W291", "SIM117"]

