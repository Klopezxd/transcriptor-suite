[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriptor-suite"
version = "2.1.0"
description = "Transcriptor Suite — Pipeline modular de transcripción, alineación fonética y diarización de audio."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Klever López", email = "lkleverjosue@gmail.com" }
]
license = { text = "MIT" }
keywords = ["whisper", "whisperx", "transcription", "diarization", "speech-to-text", "pytorch", "cuda"]
dependencies = [
    "torch",
    "torchaudio",
    "whisperx",
    "gradio>=4.0.0",
    "pyannote.audio",
    "requests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PIE"]
ignore = ["E501", "B008", "W291", "SIM117"]

