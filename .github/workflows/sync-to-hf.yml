name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/lint.yml

  sync-to-hub:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Inject Hugging Face Space Metadata
        run: |
          cat << 'EOF' > hf_header.txt
          ---
          title: Transcriptor Suite
          emoji: 🎙
          colorFrom: blue
          colorTo: gray
          sdk: gradio
          app_file: app.py
          pinned: false
          license: mit
          ---

          EOF
          cat hf_header.txt README.md > README_temp.md
          mv README_temp.md README.md
          rm hf_header.txt

      - name: Push to Hugging Face
        uses: huggingface/hub-sync@fdffea8e04104d0bd4e3181c5feb3025f0433ff5 # v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Klopezxd/transcriptor-suite
          repo_type: space
          hf_token: ${{ secrets.HF_TOKEN }}
