name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Inject Hugging Face Space Metadata
        run: |
          cat << 'EOF' > hf_header.txt
          ---
          title: WhisperX Transcriptor
          emoji: 🎙
          colorFrom: blue
          colorTo: gray
          sdk: gradio
          app_file: app.py
          pinned: false
          license: mit
          ---

          EOF
          cat hf_header.txt README.md > README_temp.md
          mv README_temp.md README.md
          rm hf_header.txt

      - name: Push to Hugging Face
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Klopezxd/transcriptor-whisperx
          repo_type: space
          hf_token: ${{ secrets.HF_TOKEN }}
